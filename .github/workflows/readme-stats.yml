name: Update README GitHub stats

on:
  push:
    paths-ignore:
      - "profile/*.svg"
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Verify GitHub token
        env:
          GH_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
        run: |
          set -euo pipefail

          test -n "$GH_TOKEN"
          echo "GH_STATS_TOKEN is present"

          GH_TOKEN="$(printf '%s' "$GH_TOKEN" | tr -d '\r\n')"
          test -n "$GH_TOKEN"
          export GH_TOKEN

          USER_LOGIN="$(gh api user --jq '.login')"
          echo "Authenticated as: $USER_LOGIN"

          gh api rate_limit --jq '"GitHub API core rate limit: " + (.resources.core.remaining|tostring) + "/" + (.resources.core.limit|tostring) + " remaining"'

          PRIVATE_REPOS="$(gh api 'user/repos?visibility=private&affiliation=owner,collaborator,organization_member&per_page=100' --paginate --jq '.[].full_name' | sed '/^$/d' | wc -l | tr -d ' ')"
          echo "Private repositories visible to token: $PRIVATE_REPOS"

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&include_all_commits=true&count_private=true&hide_border=true&theme=transparent
          path: profile/stats.svg
          token: ${{ secrets.GH_STATS_TOKEN }}
          fail_on_error: true

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=8&count_private=true&hide_border=true&theme=transparent&exclude_repo=profile
          path: profile/top-langs.svg
          token: ${{ secrets.GH_STATS_TOKEN }}
          fail_on_error: true

      - name: Validate generated cards
        run: |
          set -euo pipefail
          test -s profile/stats.svg
          test -s profile/top-langs.svg
          ! grep -qiE "Something went wrong|rate limiting|MAX_RETRY|Card generation failed" profile/stats.svg
          ! grep -qiE "Something went wrong|rate limiting|MAX_RETRY|Card generation failed" profile/top-langs.svg

      - name: Commit generated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git diff --cached --quiet || git commit -m "Update README GitHub stats"
          git push
