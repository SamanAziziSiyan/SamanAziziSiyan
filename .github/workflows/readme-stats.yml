name: Update README GitHub stats

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Verify GitHub token
        env:
          GH_STATS_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
        run: |
          set -euo pipefail

          test -n "$GH_STATS_TOKEN"
          echo "GH_STATS_TOKEN is present"

          USER_RESPONSE="$(curl -fsS             -H "Authorization: Bearer $GH_STATS_TOKEN"             -H "Accept: application/vnd.github+json"             https://api.github.com/user)"

          USER_LOGIN="$(python -c 'import json,sys; print(json.loads(sys.argv[1])["login"])' "$USER_RESPONSE")"
          echo "Authenticated as: $USER_LOGIN"

          RATE_RESPONSE="$(curl -fsS             -H "Authorization: Bearer $GH_STATS_TOKEN"             -H "Accept: application/vnd.github+json"             https://api.github.com/rate_limit)"

          python -c 'import json,sys; r=json.loads(sys.argv[1])["resources"]["core"]; print(f"GitHub API core rate limit: {r["remaining"]}/{r["limit"]} remaining")' "$RATE_RESPONSE"

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2.1.0
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&include_all_commits=true&count_private=true&hide_border=true&theme=transparent
          path: profile/stats.svg
          token: ${{ secrets.GH_STATS_TOKEN }}
          core_version: 2.1.3
          fail_on_error: true

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2.1.0
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=8&count_private=true&hide_border=true&theme=transparent
          path: profile/top-langs.svg
          token: ${{ secrets.GH_STATS_TOKEN }}
          core_version: 2.1.3
          fail_on_error: true

      - name: Validate generated cards
        run: |
          set -euo pipefail
          test -s profile/stats.svg
          test -s profile/top-langs.svg
          ! grep -qiE "Something went wrong|rate limiting|MAX_RETRY|Card generation failed" profile/stats.svg
          ! grep -qiE "Something went wrong|rate limiting|MAX_RETRY|Card generation failed" profile/top-langs.svg

      - name: Commit generated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git diff --cached --quiet || git commit -m "Update README GitHub stats"
          git push
